[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codecleaner"
dynamic = ["version"]
description = "Conservative cleanup and disk-usage analysis for development trees."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "gnrfan" },
]
keywords = [
  "cleanup",
  "disk-usage",
  "developer-tools",
  "dependencies",
  "cache",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/aognio/codecleaner"
Repository = "https://github.com/aognio/codecleaner"
Issues = "https://github.com/aognio/codecleaner/issues"

[project.scripts]
codecleaner = "codecleaner:main"

[tool.setuptools]
py-modules = ["codecleaner"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "codecleaner.VERSION" }
